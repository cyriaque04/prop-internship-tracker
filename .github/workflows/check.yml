name: prop-internship-check

# Runs 3x/day. GitHub cron is in UTC.
# 06:00 / 12:00 / 18:00 UTC ≈ morning / midday / evening in Western Europe.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit updated dedup state back

concurrency:
  group: prop-internship-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run internship check
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python3 check.py

      - name: Commit updated state & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_jobs.json reports/latest.md
          if git diff --cached --quiet; then
            echo "No state/report changes."
          else
            git commit -m "chore: update internship state [skip ci]"
            git push
          fi

